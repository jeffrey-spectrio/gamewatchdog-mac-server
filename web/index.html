<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameWatchdog Mac</title><style>
.online{color:#62d995}.offline{color:#ff7b85}.status-panel{color:#f4f7fb}.status-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.status-identity{display:flex;align-items:center;gap:9px;font-size:18px}.status-dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 12px currentColor}.status-dot.is-online{color:#49d68a;background:currentColor}.status-dot.is-offline{color:#ff6470;background:currentColor}.last-seen{font-size:12px;color:#8798b2}.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.status-tile{background:#0d1727;border:1px solid #263650;border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:5px}.status-label{font-size:11px;color:#8191aa}.status-value{font-size:14px}.status-value.good{color:#59d996}.status-value.neutral{color:#c5cfde}.status-value.bad{color:#ff7b85}
:root{color-scheme:dark;font-family:system-ui}body{margin:0;background:#09101d;color:#f4f7fb}.app{max-width:1120px;margin:auto;padding:24px}.layout{display:grid;grid-template-columns:minmax(360px,480px) minmax(420px,1fr);gap:18px;align-items:start}.card{background:#151f31;border:1px solid #29364d;border-radius:18px;padding:18px;margin:0 0 14px}h1{margin:4px 0 20px}h2{font-size:14px;color:#aebbd0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,input{width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:13px;font:inherit}button{background:#287ddd;color:white;font-weight:700;transition:filter .15s,transform .15s,background .15s}button:active{transform:scale(.97)}button:disabled{opacity:.45}.red{background:#a53d47}.green{background:#247c4b}.wide{grid-column:1/-1}.pending{background:#9a681e!important}.confirmed{background:#16824c!important}.failed{background:#9d3440!important}input{background:#0b1322;color:white;border:1px solid #33415a;margin:5px 0}.muted{color:#97a7bf;white-space:pre-wrap}.shot-nav{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center;margin-top:10px}.shot-nav span{text-align:center;color:#aebbd0}.shots{display:grid;gap:12px;margin-top:12px}.shot{background:#0b1322;border:1px solid #29364d;border-radius:14px;padding:9px}.shot img{display:block;width:100%;max-height:72vh;object-fit:contain;border-radius:10px;background:#050a12}.shot-meta{color:#97a7bf;font-size:12px;margin-top:7px}.empty{text-align:center;padding:22px;color:#71809a}@media(max-width:800px){.app{max-width:560px;padding:18px}.layout{display:block}.card{padding:16px;margin-bottom:12px}.shot img{max-height:none}}
</style></head><body><main class="app"><h1>GameWatchdog</h1><div class="layout"><div><section class="card"><h2>裝置狀態</h2><div id="status" class="muted">讀取中…</div></section><section class="card"><h2>遊戲控制</h2><div class="grid"><button class="red wide" data-command="RESTART_GAME">重新啟動遊戲</button><button class="green" data-command="ENABLE_WATCHDOG">啟用 Watchdog</button><button class="red" data-command="DISABLE_WATCHDOG">停用 Watchdog</button><button data-command="RELOGIN_HOME">立即重新登入</button><button data-command="CAPTURE_SCREEN">擷取截圖</button><button class="green" data-command="START_FARM">開始刷關</button><button class="red" data-command="STOP_FARM">停止刷關</button><button class="green" data-command="START_TICKET">開始刷券</button><button class="red" data-command="STOP_TICKET">停止刷券</button></div><p id="notice" class="muted"></p></section><section class="card"><h2>設定</h2><input id="device" value="home-zflip3"><input id="token" type="password" placeholder="Control token（只在操作時需要）"></section></div><section class="card"><h2>截圖紀錄</h2><button id="refreshShots">查看最新截圖</button><div class="shot-nav"><button id="previousShot" aria-label="上一張">←</button><span id="shotPosition">—</span><button id="nextShot" aria-label="下一張">→</button></div><div id="shots" class="shots"><div class="empty">按「查看最新截圖」後才會載入</div></div></section></div></main><script type="module" src="/app.js"></script></body></html>
