<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameWatchdog Mac</title><style>
:root{color-scheme:dark;font-family:system-ui}body{margin:0;background:#09101d;color:#f4f7fb}.app{max-width:560px;margin:auto;padding:18px}.card{background:#151f31;border:1px solid #29364d;border-radius:18px;padding:16px;margin:12px 0}h1{margin:4px 0 18px}h2{font-size:14px;color:#aebbd0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,input{width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:13px;font:inherit}button{background:#287ddd;color:white;font-weight:700}.red{background:#a53d47}.green{background:#247c4b}.wide{grid-column:1/-1}input{background:#0b1322;color:white;border:1px solid #33415a;margin:5px 0}.muted{color:#97a7bf;white-space:pre-wrap}img{width:100%;border-radius:12px;margin-top:10px}
</style></head><body><main class="app"><h1>GameWatchdog</h1><section class="card"><h2>裝置狀態</h2><div id="status" class="muted">讀取中…</div></section><section class="card"><h2>遊戲控制</h2><div class="grid"><button class="red wide" data-command="RESTART_GAME">重新啟動遊戲</button><button class="green" data-command="ENABLE_WATCHDOG">啟用 Watchdog</button><button class="red" data-command="DISABLE_WATCHDOG">停用 Watchdog</button><button data-command="RELOGIN_HOME">立即重新登入</button><button data-command="CAPTURE_SCREEN">擷取截圖</button><button class="green" data-command="START_FARM">開始刷關</button><button class="red" data-command="STOP_FARM">停止刷關</button><button class="green" data-command="START_TICKET">開始刷券</button><button class="red" data-command="STOP_TICKET">停止刷券</button></div><p id="notice" class="muted"></p></section><section class="card"><h2>設定</h2><input id="device" value="home-zflip3"><input id="token" type="password" placeholder="Control token"></section></main><script type="module" src="/app.js"></script></body></html>
